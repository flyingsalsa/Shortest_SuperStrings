[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "scs-greedy"
version = "0.1.0"
description = "Shortest Superstring: How Good Is Greedy? (undergraduate research code)"
requires-python = ">=3.10"
dependencies = ["numpy", "matplotlib", "psutil"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["scs", "scs.bio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
